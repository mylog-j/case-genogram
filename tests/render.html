<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>가계도 그리기 확인</title>
<style>body{font:14px system-ui;margin:16px;background:#f3f1ee} figure{background:#fff;margin:0 0 16px;padding:8px;display:inline-block;vertical-align:top;max-width:100%} figure svg{max-width:100%;height:auto} figcaption{font-size:12px;color:#666;max-width:520px;white-space:pre-wrap}</style>
</head>
<body>
<div id="out"></div>
<script src="../js/model.js"></script>
<script src="../js/parser.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/genogram.js"></script>
<script>
var cases = [
  '내담자는 김하늘(여, 16세)이다.\n아버지는 김정우(47세)이고, 어머니는 박선영(44세)이다.\n아버지와 어머니는 2021년에 이혼했다.\n오빠 김바다(19세)가 있고, 남동생 김지후(12세)가 있다.\n외할머니는 2021년에 사망했다.\n하늘이는 어머니와 밀착되어 있다.\n하늘이와 아버지는 갈등이 심하다.\n오빠와 아버지는 연락이 끊겨 단절된 상태이다.',
  '내담자는 김민준(남, 14세)이다. 아버지 김철수(45세)와 어머니 이영희(42세)는 2018년에 이혼했다. 아버지는 재혼했다. 새어머니 박미라(40세)가 있다. 이복동생 김하준(5세)이 있다. 어머니는 2020년에 재혼했다. 새아버지 최성호(46세)가 있다. 친할아버지는 사망했다. 친할머니(72세)가 있다. 고모 김미영(48세)이 있다. 내담자는 새아버지와 적대적이다. 내담자는 어머니, 새아버지와 함께 산다.',
  '내담자는 이수민(여, 38세)이다. 남편 박준호(40세)와 2010년에 결혼했다. 일란성 쌍둥이 딸이 있다. 입양한 아들 박도윤(5세)이 있다. 내담자는 2019년에 유산을 경험했다. 시어머니가 내담자의 모든 결정을 대신 결정한다. 내담자는 남편과 사이가 좋지만 자주 충돌한다. 반려견 콩이가 있다.',
  '동생이 있다. 내담자와 동생은 친밀하다.',
  '내담자 A는 45세 여성으로 1남 2녀 중 장녀이며, 남편 B는 50세 남성으로 2남 1녀 중 차남이다.\n두 사람에게는 12세 딸과 9세 아들이 있으며 현재 셋째 자녀를 임신 중이다.\n내담자와 남편, 딸, 아들은 함께 살고 있다.\n내담자의 아버지는 75세이고 어머니는 72세이다. 내담자는 아버지와 친밀하지만 어머니와는 어색하다.\n내담자의 40세 남동생과는 갈등이 있다.\n남편의 아버지는 2015년에 사망했으며 어머니는 75세이다.\n내담자는 시어머니와 사이가 좋다.\n남편에게는 누나 한 명과 남동생 한 명이 있다.\n12세 딸과 9세 아들은 서로 친밀하다.',
  '내담자는 김지원(여, 34세)이다. 형부 박성진이 있다. 당숙이 있다. 외사촌 오빠가 있다. 처남은 없다.'
];
cases.forEach(function (t) {
  var m = GenogramParser.parse(t);
  var g = GenogramRender.render(m, { generations: true });
  var f = document.createElement('figure');
  f.innerHTML = (g ? g.svg : '(없음)') + '<figcaption>' + t + '\n— 고를 것: ' + m.choices.length + '</figcaption>';
  document.getElementById('out').appendChild(f);
});
</script>
</body>
</html>
